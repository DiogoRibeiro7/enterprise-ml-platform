apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mlp-api-hpa
  namespace: mlp-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mlp-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
