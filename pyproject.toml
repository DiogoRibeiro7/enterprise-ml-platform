[build-system]
requires = ["setuptools>=65.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ml-platform"
description = "A comprehensive, production-ready machine learning platform designed for enterprise environments"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt"}
]
maintainers = [
    {name = "Diogo Ribeiro", email = "diogo.debastos.ribeiro@gmail.com"}
]
keywords = [
    "machine-learning",
    "mlops",
    "data-science",
    "ai",
    "enterprise",
    "pipeline",
    "automation",
    "kubernetes",
    "cloud",
    "monitoring"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed"
]
requires-python = ">=3.11"
dynamic = ["version"]

# Core dependencies.
#
# Only what every import path needs. Anything a single subsystem needs lives
# in an extra below, so `pip install enterprise-ml-platform` stays small and
# a user installs the parts of the platform they actually run.
#
# Bounds are lower-bound-and-major-cap and are kept in step with what CI
# resolves. Caps that exclude the versions the tests pass against are worse
# than no caps at all.
dependencies = [
    # Numerical and modelling core
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.3,<2",
    "joblib>=1.3,<2",

    # Configuration, logging, metrics
    "pydantic>=2.5,<3",
    "structlog>=23.2",
    "prometheus-client>=0.19,<1",
    "pyyaml>=6.0,<7",

    # Online feature store and columnar IO. The pyarrow floor is set by
    # PYSEC-2026-113.
    "redis>=5.0,<7",
    "pyarrow>=23.0.1",

    # Security primitives. The floor cannot be raised past PYSEC-2026-3552
    # (fixed in 50.0) while mlflow pins cryptography<50; the audit step in
    # .github/workflows/security.yml carries the matching exception.
    "cryptography>=45.0",

    # CLI front end
    "typer>=0.9,<1",
    "rich>=13.0",
]

[project.optional-dependencies]
# --- Runtime extras: install the subsystems you run -------------------
# HTTP serving layer
api = [
    "fastapi>=0.104,<1",
    "uvicorn[standard]>=0.24,<1",
    "httpx>=0.25,<1",
]

# Persistent offline feature store (Parquet queried through DuckDB)
feature-store = [
    "duckdb>=0.10",
]

# Experiment tracking, model registry and hyperparameter search
training = [
    # The mlflow floor is set by the advisories the dependency audit reports
    # against 3.14 and earlier; the API this project uses is unchanged.
    "mlflow>=3.15",
    "optuna>=3.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
]

# Model explainability
explainability = [
    "shap>=0.43",
    "lime>=0.2",
]

# AWS SageMaker deployment and S3 ingestion
aws = [
    "boto3>=1.34",
    "aioboto3>=12.0",
]

# Kafka streaming ingestion
streaming = [
    "aiokafka>=0.9",
    "confluent-kafka>=2.3",
]

# Distributed execution backends
distributed = [
    "ray[tune]>=2.8",
    "dask[complete]>=2023.9",
]

# Relational sources and sinks
data = [
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
]

# Transformer-based examples
deep-learning = [
    "torch>=2.0",
    "transformers>=4.30",
    "langdetect>=1.0.9",
]

# --- Development extras -----------------------------------------------
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.2",
    "fakeredis>=2.20",
    "hypothesis>=6.90",
]

lint = [
    "ruff>=0.5",
    "mypy>=1.7",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.5",
]

docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=0.24",
]

# Everything needed to run the test suite against every subsystem.
dev = [
    "enterprise-ml-platform[api,feature-store,training,aws,test,lint]",
]

# Every runtime subsystem. Large; prefer naming the extras you need.
all = [
    "enterprise-ml-platform[api,feature-store,training,explainability,aws,streaming,distributed,data]",
]

[project.scripts]
# Main CLI entry point
mlp = "enterprise_ml_platform.cli.main:run"
enterprise-ml = "enterprise_ml_platform.cli.main:run"

# API server
mlp-server = "enterprise_ml_platform.api.main:start_server"

[project.entry-points."enterprise_ml_platform.connectors"]
s3 = "enterprise_ml_platform.services.data_ingestion.connectors.s3_connector:S3DataConnector"
postgres = "enterprise_ml_platform.services.data_ingestion.connectors.postgres_connector:PostgresDataConnector"
kafka = "enterprise_ml_platform.services.data_ingestion.connectors.kafka_connector:KafkaConnector"

[project.entry-points."enterprise_ml_platform.transformers"]
numerical = "enterprise_ml_platform.services.feature_engineering.transformers.numerical_transformer:NumericalFeatureTransformer"
categorical = "enterprise_ml_platform.services.feature_engineering.transformers.categorical_transformer:CategoricalFeatureTransformer"
temporal = "enterprise_ml_platform.services.feature_engineering.transformers.temporal_transformer:TemporalFeatureTransformer"
composite = "enterprise_ml_platform.services.feature_engineering.transformers.composite_transformer:CompositeFeatureTransformer"

[project.entry-points."enterprise_ml_platform.trainers"]
xgboost = "enterprise_ml_platform.services.model_training.trainers.xgboost_trainer:XGBoostTrainer"
lightgbm = "enterprise_ml_platform.services.model_training.trainers.lightgbm_trainer:LightGBMTrainer"
ensemble = "enterprise_ml_platform.services.model_training.trainers.ensemble_trainer:EnsembleTrainer"

[project.entry-points."enterprise_ml_platform.deployers"]
sagemaker = "enterprise_ml_platform.services.model_deployment.deployers.aws_deployer:AWSDeployer"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["enterprise_ml_platform*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"enterprise_ml_platform" = [
    "py.typed",
    "*.yaml",
    "*.yml",
    "*.json",
    "*.toml",
    "*.txt",
    "templates/*",
    "configs/*"
]

[tool.setuptools_scm]
write_to = "src/enterprise_ml_platform/_version.py"
version_scheme = "release-branch-semver"
local_scheme = "dirty-tag"

# =============================================================================
# DEVELOPMENT TOOLS CONFIGURATION
# =============================================================================

# Black code formatting
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

# isort import sorting
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["enterprise_ml_platform"]
known_third_party = [
    "numpy", "pandas", "sklearn", "xgboost", "lightgbm", "catboost",
    "torch", "transformers", "mlflow", "optuna", "ray", "dask",
    "fastapi", "pydantic", "sqlalchemy", "kubernetes", "boto3"
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# MyPy type checking
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "xgboost.*",
    "lightgbm.*",
    "catboost.*",
    "shap.*",
    "lime.*",
    "alibi.*",
    "evidently.*",
    "great_expectations.*",
    "deepchecks.*",
    "grafana_api.*",
    "GPUtil.*"
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--verbose",
    "--tb=short",
    "--cov=enterprise_ml_platform",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=0",
    "--junitxml=test-results/junit.xml"
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "gpu: marks tests that require GPU",
    "cloud: marks tests that require cloud resources",
    "performance: marks tests as performance tests"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
asyncio_mode = "auto"

# Coverage configuration
[tool.coverage.run]
source = ["src/enterprise_ml_platform"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/_version.py",
    "*/migrations/*"
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]
show_missing = true
precision = 2

# Pylint configuration
[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0613",  # unused-argument
    "W0622",  # redefined-builtin
]

[tool.pylint.format]
max-line-length = "88"

# Bandit security linting
[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

# Ruff linting (alternative to flake8)
[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "ARG002", # unused method argument
    "ARG001", # unused function argument
]
unfixable = [
    "F841",  # unused variables
]

[tool.ruff.per-file-ignores]
"tests/*" = ["ARG", "FBT"]
"__init__.py" = ["F401"]
"migrations/*" = ["ARG001"]

[tool.ruff.isort]
known-first-party = ["enterprise_ml_platform"]
