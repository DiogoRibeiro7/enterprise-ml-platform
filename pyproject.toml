[build-system]
requires = ["setuptools>=65.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ml-platform"
description = "A comprehensive, production-ready machine learning platform designed for enterprise environments"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt"}
]
maintainers = [
    {name = "Diogo Ribeiro", email = "diogo.debastos.ribeiro@gmail.com"}
]
keywords = [
    "machine-learning",
    "mlops",
    "data-science",
    "ai",
    "enterprise",
    "pipeline",
    "automation",
    "kubernetes",
    "cloud",
    "monitoring"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Data Scientists",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed"
]
requires-python = ">=3.9"
dynamic = ["version"]

# Core dependencies for production use
dependencies = [
    # Core ML libraries
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.1.0,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "xgboost>=2.0.0,<3.0.0",
    "lightgbm>=4.0.0,<5.0.0",
    "catboost>=1.2.0,<2.0.0",
    
    # Deep learning
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0,<1.0.0",
    "transformers>=4.30.0,<5.0.0",
    
    # Feature engineering and preprocessing
    "category-encoders>=2.6.0,<3.0.0",
    "feature-engine>=1.6.0,<2.0.0",
    "imbalanced-learn>=0.11.0,<1.0.0",
    
    # Data processing and manipulation
    "pyarrow>=12.0.0,<14.0.0",
    "polars>=0.20.0,<1.0.0",
    "dask[complete]>=2023.9.0,<2024.0.0",
    "modin[all]>=0.23.0,<1.0.0",
    
    # Experiment tracking and model registry
    "mlflow>=2.8.0,<3.0.0",
    "wandb>=0.16.0,<1.0.0",
    "optuna>=3.4.0,<4.0.0",
    "ray[tune,serve]>=2.8.0,<3.0.0",
    
    # Model explainability
    "shap>=0.43.0,<1.0.0",
    "lime>=0.2.0,<1.0.0",
    "alibi[all]>=0.9.4,<1.0.0",
    "evidently>=0.4.15,<1.0.0",
    
    # Data validation and quality
    "great-expectations>=0.18.0,<1.0.0",
    "deepchecks>=0.17.0,<1.0.0",
    "pandera>=0.17.0,<1.0.0",
    
    # Async and web framework
    "asyncio>=3.4.3",
    "aiohttp>=3.9.0,<4.0.0",
    "fastapi>=0.104.0,<1.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "typer[all]>=0.9.0,<1.0.0",
    "rich>=13.0.0,<14.0.0",
    
    # Database and storage
    "sqlalchemy>=2.0.0,<3.0.0",
    "alembic>=1.12.0,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "aioboto3>=12.0.0,<13.0.0",
    "redis>=5.0.0,<6.0.0",
    "pymongo>=4.6.0,<5.0.0",
    
    # Message queues and streaming
    "aiokafka>=0.9.0,<1.0.0",
    "confluent-kafka>=2.3.0,<3.0.0",
    "pika>=1.3.0,<2.0.0",
    
    # Cloud providers SDKs
    "boto3>=1.34.0,<2.0.0",
    "google-cloud-aiplatform>=1.38.0,<2.0.0",
    "azure-ai-ml>=1.12.0,<2.0.0",
    "azure-identity>=1.15.0,<2.0.0",
    
    # Kubernetes and containerization
    "kubernetes>=28.1.0,<29.0.0",
    "docker>=7.0.0,<8.0.0",
    
    # Monitoring and observability
    "prometheus-client>=0.19.0,<1.0.0",
    "grafana-api>=1.0.3,<2.0.0",
    "elasticsearch>=8.11.0,<9.0.0",
    "structlog>=23.2.0,<24.0.0",
    "opentelemetry-api>=1.21.0,<2.0.0",
    "opentelemetry-sdk>=1.21.0,<2.0.0",
    
    # Security and encryption
    "cryptography>=41.0.0,<42.0.0",
    "bcrypt>=4.1.0,<5.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    
    # Configuration and CLI
    "click>=8.1.0,<9.0.0",
    "typer>=0.9.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "hydra-core>=1.3.0,<2.0.0",
    
    # Utilities
    "tqdm>=4.66.0,<5.0.0",
    "joblib>=1.3.0,<2.0.0",
    "psutil>=5.9.0,<6.0.0",
    "requests>=2.31.0,<3.0.0",
    "httpx>=0.25.0,<1.0.0",
    "tenacity>=8.2.0,<9.0.0",
    "cachetools>=5.3.0,<6.0.0",
    
    # Statistical and mathematical libraries
    "scipy>=1.11.0,<2.0.0",
    "statsmodels>=0.14.0,<1.0.0",
    "networkx>=3.2.0,<4.0.0",
    
    # Dependency injection
    "dependency-injector>=4.41.0,<5.0.0",
    "injector>=0.21.0,<1.0.0"
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "pytest-sugar>=0.9.7,<1.0.0",
    "pytest-clarity>=1.0.1,<2.0.0",
    "coverage>=7.3.0,<8.0.0",
    "pre-commit>=3.6.0,<4.0.0",
    "black>=23.12.0,<24.0.0",
    "isort>=5.13.0,<6.0.0",
    "flake8>=7.0.0,<8.0.0",
    "mypy>=1.8.0,<2.0.0",
    "pylint>=3.0.0,<4.0.0",
    "bandit>=1.7.5,<2.0.0",
    "safety>=3.0.0,<4.0.0"
]

# Documentation dependencies
docs = [
    "sphinx>=7.2.0,<8.0.0",
    "sphinx-rtd-theme>=2.0.0,<3.0.0",
    "sphinx-autodoc-typehints>=1.25.0,<2.0.0",
    "myst-parser>=2.0.0,<3.0.0",
    "sphinx-copybutton>=0.5.2,<1.0.0",
    "sphinxcontrib-mermaid>=0.9.2,<1.0.0",
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0.0",
    "mkdocs-mermaid2-plugin>=1.1.0,<2.0.0"
]

# Testing dependencies
test = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "factory-boy>=3.3.0,<4.0.0",
    "faker>=21.0.0,<22.0.0",
    "hypothesis>=6.92.0,<7.0.0",
    "locust>=2.18.0,<3.0.0",
    "testcontainers>=3.7.1,<4.0.0"
]

# Performance and profiling
performance = [
    "py-spy>=0.3.14,<1.0.0",
    "memory-profiler>=0.61.0,<1.0.0",
    "line-profiler>=4.1.0,<5.0.0",
    "scalene>=1.5.0,<2.0.0",
    "psutil>=5.9.0,<6.0.0"
]

# Jupyter and notebook support
jupyter = [
    "jupyter>=1.0.0,<2.0.0",
    "jupyterlab>=4.0.0,<5.0.0",
    "notebook>=7.0.0,<8.0.0",
    "ipywidgets>=8.1.0,<9.0.0",
    "ipykernel>=6.27.0,<7.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "plotly>=5.17.0,<6.0.0"
]

# GPU support
gpu = [
    "torch>=2.0.0,<3.0.0",
    "torchvision>=0.15.0,<1.0.0",
    "cupy-cuda12x>=12.3.0,<13.0.0",
    "cudf-cu12>=23.12.0,<24.0.0",
    "cuml-cu12>=23.12.0,<24.0.0",
    "rapids-dependency-file-generator>=1.8.0,<2.0.0"
]

# All optional dependencies for complete installation
all = [
    "enterprise-ml-platform[dev,docs,test,performance,jupyter,gpu]"
]

[project.urls]
Homepage = "https://github.com/diogoribeiro7/enterprise-ml-platform"
Documentation = "https://diogoribeiro7.github.io/enterprise-ml-platform"
Repository = "https://github.com/diogoribeiro7/enterprise-ml-platform.git"
Issues = "https://github.com/diogoribeiro7/enterprise-ml-platform/issues"
Changelog = "https://github.com/diogoribeiro7/enterprise-ml-platform/releases"
Discussions = "https://github.com/diogoribeiro7/enterprise-ml-platform/discussions"
"Author ORCID" = "https://orcid.org/0009-0001-2022-7072"
"Professional Contact" = "mailto:dfr@esmad.ipp.pt"
"Personal Contact" = "mailto:diogo.debastos.ribeiro@gmail.com"

[project.scripts]
# Main CLI entry point
mlp = "enterprise_ml_platform.cli.main:main"
enterprise-ml = "enterprise_ml_platform.cli.main:main"

# Utility scripts
mlp-server = "enterprise_ml_platform.api.main:start_server"
mlp-worker = "enterprise_ml_platform.workers.main:start_worker"
mlp-monitor = "enterprise_ml_platform.monitoring.cli:main"

[project.entry-points."enterprise_ml_platform.connectors"]
s3 = "enterprise_ml_platform.services.data_ingestion.connectors.s3_connector:S3DataConnector"
postgres = "enterprise_ml_platform.services.data_ingestion.connectors.postgres_connector:PostgreSQLConnector"
kafka = "enterprise_ml_platform.services.data_ingestion.connectors.kafka_connector:KafkaStreamConnector"
api = "enterprise_ml_platform.services.data_ingestion.connectors.api_connector:APIConnector"

[project.entry-points."enterprise_ml_platform.transformers"]
numerical = "enterprise_ml_platform.services.feature_engineering.transformers.numerical_transformer:NumericalFeatureTransformer"
categorical = "enterprise_ml_platform.services.feature_engineering.transformers.categorical_transformer:CategoricalFeatureTransformer"
temporal = "enterprise_ml_platform.services.feature_engineering.transformers.temporal_transformer:TemporalFeatureTransformer"
composite = "enterprise_ml_platform.services.feature_engineering.transformers.composite_transformer:CompositeFeatureTransformer"

[project.entry-points."enterprise_ml_platform.trainers"]
xgboost = "enterprise_ml_platform.services.model_training.trainers.xgboost_trainer:XGBoostTrainer"
lightgbm = "enterprise_ml_platform.services.model_training.trainers.lightgbm_trainer:LightGBMTrainer"
ensemble = "enterprise_ml_platform.services.model_training.trainers.ensemble_trainer:EnsembleTrainer"
neural = "enterprise_ml_platform.services.model_training.trainers.neural_trainer:NeuralNetworkTrainer"

[project.entry-points."enterprise_ml_platform.deployers"]
kubernetes = "enterprise_ml_platform.services.model_deployment.deployers.kubernetes_deployer:KubernetesDeployer"
sagemaker = "enterprise_ml_platform.services.model_deployment.deployers.sagemaker_deployer:SageMakerDeployer"
gcp = "enterprise_ml_platform.services.model_deployment.deployers.gcp_deployer:GCPDeployer"
azure = "enterprise_ml_platform.services.model_deployment.deployers.azure_deployer:AzureDeployer"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["enterprise_ml_platform*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"enterprise_ml_platform" = [
    "py.typed",
    "*.yaml",
    "*.yml",
    "*.json",
    "*.toml",
    "*.txt",
    "templates/*",
    "configs/*"
]

[tool.setuptools_scm]
write_to = "src/enterprise_ml_platform/_version.py"
version_scheme = "release-branch-semver"
local_scheme = "dirty-tag"

# =============================================================================
# DEVELOPMENT TOOLS CONFIGURATION
# =============================================================================

# Black code formatting
[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

# isort import sorting
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["enterprise_ml_platform"]
known_third_party = [
    "numpy", "pandas", "sklearn", "xgboost", "lightgbm", "catboost",
    "torch", "transformers", "mlflow", "optuna", "ray", "dask",
    "fastapi", "pydantic", "sqlalchemy", "kubernetes", "boto3"
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# MyPy type checking
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "xgboost.*",
    "lightgbm.*",
    "catboost.*",
    "shap.*",
    "lime.*",
    "alibi.*",
    "evidently.*",
    "great_expectations.*",
    "deepchecks.*",
    "grafana_api.*",
    "GPUtil.*"
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=enterprise_ml_platform",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=0",
    "--junitxml=test-results/junit.xml"
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "gpu: marks tests that require GPU",
    "cloud: marks tests that require cloud resources",
    "performance: marks tests as performance tests"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
asyncio_mode = "auto"

# Coverage configuration
[tool.coverage.run]
source = ["src/enterprise_ml_platform"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/_version.py",
    "*/migrations/*"
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]
show_missing = true
precision = 2

# Pylint configuration
[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0613",  # unused-argument
    "W0622",  # redefined-builtin
]

[tool.pylint.format]
max-line-length = "88"

# Bandit security linting
[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

# Ruff linting (alternative to flake8)
[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "ARG002", # unused method argument
    "ARG001", # unused function argument
]
unfixable = [
    "F841",  # unused variables
]

[tool.ruff.per-file-ignores]
"tests/*" = ["ARG", "FBT"]
"__init__.py" = ["F401"]
"migrations/*" = ["ARG001"]

[tool.ruff.isort]
known-first-party = ["enterprise_ml_platform"]
