name: CI

on:
  push:
    branches: [main]
  # No base branch filter: a pull request stacked on another branch still has
  # to be checked, and filtering by base would silently skip every one of them.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must match tool.mypy's python_version: mypy reads the stubs
          # installed for the running interpreter, and numpy's 3.12 stubs use
          # syntax that a 3.11 target rejects.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check src tests

      - name: ruff format
        run: ruff format --check src tests

      - name: mypy
        run: mypy src/enterprise_ml_platform

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run the suite
        run: pytest --cov=enterprise_ml_platform --cov-report=xml --cov-report=term

      - name: Fail if the working tree is dirty
        # Tests that write into the repository (tracking stores, artifacts,
        # caches) are how a build starts depending on leftover state.
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  packaging:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm derives the version from tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Install the built wheel into a clean environment
        # `pip install .` and then running the command is the first thing a
        # reader of the README does. A console script pointing at a module that
        # was never written only fails here.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import enterprise_ml_platform; print(enterprise_ml_platform.__name__)"
          /tmp/smoke/bin/mlp --help
          /tmp/smoke/bin/enterprise-ml --version

      - name: Check the distribution metadata
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate the Compose stack
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: enterprise-ml-platform/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the Prometheus image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.monitoring
          push: false
          tags: enterprise-ml-platform/prometheus:ci
          cache-from: type=gha,scope=prometheus
          cache-to: type=gha,mode=max,scope=prometheus
